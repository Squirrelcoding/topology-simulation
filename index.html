<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My first three.js app</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* UI overlay */
      #ui {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10;

        background: white; 
        color: black;
        padding: 12px;
        border-radius: 8px;
        font-family: sans-serif;
      }

      #ui button {
        display: block;
        margin-top: 6px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- 2D menu -->
    <div id="ui">
		<p>Fundamental square  </p>
      <div id='container'></div>
    </div>

    <!-- three.js app -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
